<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eka's Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
        <a href="#" class="logo">Eka</a>
        <i class="fa-solid fa-bars" id="menu-icon"></i>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="skill.html">Skills</a>
            <a href="experience.html">Experience</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

    <section class="page-header">
        <h1>Get in Touch</h1>
        <h3>Feel free to reach out for projects, collaborations, or just a friendly hello :></h3>
    </section>

    <section class="contact">
        <div class="contact-container">
            <div class="contact-card">
                <img src="assets/email2.png">
                <h3>Email</h3>
                <p><a href="mailto:ekak8417@gmail.com">ekak8417@gmail.com</a></p>
            </div>

            <div class="contact-card">
                <img src="assets/linkedin.png">

    <footer class="footer">

    </footer>


    <script>
        let menuIcon = document.querySelector('#menu-icon');
        let navbar = document.querySelector('.navbar');

        menuIcon.onclick = () => {
            menuIcon.classList.toggle('fa-xmark');
            navbar.classList.toggle('active');
        }

        window.onscroll = () => {
            menuIcon.classList.remove('fa-xmark');
            navbar.classList.remove('active');
        } 
    </script>
</body>
</html>
